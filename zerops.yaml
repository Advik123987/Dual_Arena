zerops:
  - setup: api
    build:
      base: python@3.11
      buildCommands:
        - echo "build step"
      addToRunPrepare:
        - api/requirements.txt
      deployFiles:
        - api/~
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - apt-get update -qq && apt-get install -y default-jdk gcc python3-dev 2>/dev/null || true
        - python3 -m pip install --break-system-packages --prefer-binary --no-cache-dir -r /home/zerops/requirements.txt || python3 -m pip install --break-system-packages --no-cache-dir -r /home/zerops/requirements.txt
      envVariables:
        PORT: 8000
      start: uvicorn main:app --host 0.0.0.0 --port 8000
      healthCheck:
        httpGet:
          port: 8000
          path: /health

  - setup: gui
    build:
      base: nodejs@20
      buildCommands:
        - cd gui && npm install && npm run build
      deployFiles:
        - gui/dist/~
      cache:
        - gui/node_modules
      envVariables:
        VITE_API_HTTP_URL: https://api-2d4c-8000.prg1.zerops.app
        VITE_API_WS_URL: wss://api-2d4c-8000.prg1.zerops.app
    run:
      os: alpine
      base: static
      ports:
        - port: 80
          httpSupport: true
