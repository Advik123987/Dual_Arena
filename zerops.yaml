zerops:
  - setup: api
    build:
      base: python@3.11
      buildCommands:
        - cd api && pip install --target=./vendor -r requirements.txt
      deployFiles:
        - api/~
      cache:
        - api/vendor
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        PORT: 8000
        PYTHONPATH: ./vendor
      start: python3 -m uvicorn main:app --host 0.0.0.0 --port 8000
      healthCheck:
        httpGet:
          port: 8000
          path: /health

  - setup: gui
    build:
      base: nodejs@20
      buildCommands:
        - cd gui && npm install && npm run build
      deployFiles:
        - gui/dist/~
      cache:
        - gui/node_modules
      envVariables:
        VITE_API_HTTP_URL: https://api-2d4c-8000.prg1.zerops.app
        VITE_API_WS_URL: wss://api-2d4c-8000.prg1.zerops.app
    run:
      base: static

